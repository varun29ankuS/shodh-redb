[package]
name = "redb-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.1.0", features = ["derive"] }
libfuzzer-sys = { version = "0.4.0", features = ["arbitrary-derive"] }
tempfile = "3.2.0"
rand = "0.8.5"
rand_distr = "0.4.3"

[dependencies.redb]
package = "shodh-redb"
path = ".."
features = ["std", "fuzzing"]

# Debug assertions stay ON for fuzzing, deliberately.
#
# This setting used to be `false`, on the theory that the fuzzer should
# exercise the production path. It never took effect: `cargo fuzz run` appends
# `-Cdebug-assertions` to RUSTFLAGS (see its own --help: "equivalent to
# cargo build --release, but with debug assertions and overflow checks
# enabled"), and a rustc flag beats a profile setting. Passing `-O` is the only
# way to actually disable them.
#
# Keeping them on is the right call anyway. A debug assertion that a crafted
# database image can reach is a finding, not noise: it marks a place where the
# release build carries on with the invariant already violated. That is exactly
# how the table-type coercion bug in #340 surfaced. Setting this to `true`
# states the intent independently of how cargo-fuzz happens to build today.
[profile.release]
debug-assertions = true

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_redb"
path = "fuzz_targets/fuzz_redb.rs"
test = false
doc = false

